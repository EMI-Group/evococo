            bottom: -20px;
            width: 2px;

            border-right: 1px solid #1e293b;
        }

        .resizer-x:hover,

            background-color: #6366f1;
        }

        .resizer-y {
            height: 5px;
            cursor: row-resize;
            background-color: #0f172a;
            transition: background-color 0.2s;
            z-index: 50;
            flex-shrink: 0;
            border-top: 1px solid #1e293b;
            border-bottom: 1px solid #1e293b;
        }

        .resizer-y:hover,
        .resizer-y.resizing {
            background-color: #6366f1;
        }

        body.resizing {
            cursor: col-resize;
            user-select: none;
        }

        body.resizing-row {
            cursor: row-resize;
            user-select: none;
        }


        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.3s ease-out forwards;
        }

        @keyframes pulse-glow {

            0%,
            100% {
                box-shadow: 0 0 15px rgba(99, 102, 241, 0.15);
                border-color: #6366f1;
            }

            50% {
                box-shadow: 0 0 25px rgba(99, 102, 241, 0.4);
                border-color: #818cf8;
            }
        }

        .tournament-active {
            animation: pulse-glow 2s infinite;
        }

        /* Markdown */
        .markdown-view {
            padding: 1.5rem;
            line-height: 1.7;
            color: #cbd5e1;
            font-size: 0.95rem;
        }

        .markdown-view h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 0.5rem;
        }

        .markdown-view h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #f1f5f9;
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .markdown-view code {
            background-color: #334155;
            color: #e2e8f0;
            padding: 0.2rem 0.4rem;
            rounded: 0.25rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
        }

        .markdown-view pre {
            background-color: #0f172a;
            padding: 1rem;
            rounded: 0.5rem;
            overflow-x: auto;
            margin-bottom: 1rem;
            border: 1px solid #334155;
        }
    </style>
</head>

                    spellcheck="false" placeholder="% Paste your MATLAB code here...">classdef NSGAIISDR < ALGORITHM
% <2019> <many> <real/integer/label/binary/permutation>
% NSGA-II with strengthened dominance relation

    methods
        function main(Algorithm,Problem)
            %% Generate random population
            Population = Problem.Initialization();
            zmin       = min(Population.objs,[],1);
            zmax       = max(Population.objs,[],1);
            [~,FrontNo,CrowdDis] = EnvironmentalSelection(Population,Problem.N,zmin,zmax);

            %% Optimization
            while Algorithm.NotTerminated(Population)
                MatingPool = TournamentSelection(2,Problem.N,FrontNo,-CrowdDis);
                Offspring  = OperatorGA(Problem,Population(MatingPool));
                zmin       = min([zmin;Offspring.objs],[],1);
                zmax       = max(Population(FrontNo==1).objs,[],1);
                [Population,FrontNo,CrowdDis] = EnvironmentalSelection([Population,Offspring],Problem.N,zmin,zmax);
            end
        end
    end
end

function [FrontNo,MaxFNo] = NDSort_SDR(PopObj,nSort)
% Do non-dominated sorting by strengthened dominance relation (SDR)
    N      = size(PopObj,1);
    NormP  = sum(PopObj,2);
    cosine = 1 - pdist2(PopObj,PopObj,'cosine');
    cosine(logical(eye(length(cosine)))) = 0;
    Angle  = acos(cosine);

    temp  = sort(unique(min(Angle,[],2)));
    minA  = temp(min(ceil(N/2),end));
    Theta = max(1,(Angle./minA).^1);

    dominate = false(N);
    for i = 1 : N-1
        for j = i+1 : N
            if NormP(i)*Theta(i,j) < NormP(j)
                dominate(i,j) = true;
            elseif NormP(j)*Theta(j,i) < NormP(i)
                dominate(j,i) = true;
            end
        end
    end

    FrontNo = inf(1,N);
    MaxFNo  = 0;
    while sum(FrontNo~=inf) < min(nSort,N)
        MaxFNo  = MaxFNo + 1;
        current = ~any(dominate,1) & FrontNo==inf;
        FrontNo(current)    = MaxFNo;
        dominate(current,:) = false;
    end
end

function [Population,FrontNo,CrowdDis] = EnvironmentalSelection(Population,N,zmin,zmax)
% The environmental selection of NSGA-II
    %% Normalization
    PopObj = Population.objs - repmat(zmin,length(Population),1);
    range  = zmax - zmin;
    if 0.05*max(range) < min(range)
        PopObj = PopObj./repmat(range,length(Population),1);
    end
    [~,x]      = unique(round(PopObj*1e6)/1e6,'rows');
    PopObj     = PopObj(x,:);
    Population = Population(x);
    N          = min(N,length(Population));

    %% Non-dominated sorting
    [FrontNo,MaxFNo] = NDSort_SDR(PopObj,N);
    Next = FrontNo < MaxFNo;

    %% Calculate the crowding distance of each solution
    CrowdDis = CrowdingDistance(PopObj,FrontNo);

    %% Select the solutions in the last front based on their crowding distances
    Last     = find(FrontNo==MaxFNo);
    [~,Rank] = sort(CrowdDis(Last),'descend');
    Next(Last(Rank(1:N-sum(Next)))) = true;

    %% Population for next generation
    Population = Population(Next);
    FrontNo    = FrontNo(Next);
    CrowdDis   = CrowdDis(Next);
end

            </div>
            <div class="p-4 border-t border-slate-800 bg-slate-900">
                <button id="run-btn" onclick="startPipeline()"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-lg shadow-lg shadow-indigo-900/20 transition-all flex items-center justify-center gap-2 text-sm disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-play"></i> Run Tournament

            </div>
        </section>

        <div class="resizer-x" id="resizer-left"></div>

        <section id="panel-middle" style="width: 33%; min-width: 300px;"

                    class="p-3 border-b border-slate-800 flex justify-between items-center bg-slate-800/50 backdrop-blur shrink-0">
                    <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider flex items-center gap-2">
                        <i class="fa-solid fa-layer-group text-sm"></i> Execution Trace
                    </h2>
                </div>

                <div class="flex-1 overflow-y-auto p-6 pb-10 relative scroll-smooth" id="flow-container">

                        id="empty-state">
                        <div

                            <i class="fa-solid fa-network-wired text-3xl"></i>
                        </div>
                        <p class="text-sm font-medium">Pipeline Idle</p>
                    </div>
                </div>
            </div>

            <div class="resizer-y" id="resizer-middle"></div>

            <div id="panel-middle-bottom" style="flex: 1; min-height: 100px;" class="flex flex-col bg-[#0a0a0a]">
                <div
                    class="px-4 py-2 bg-slate-900/80 border-b border-slate-800 flex justify-between items-center backdrop-blur shrink-0">
                    <span class="text-xs text-slate-400 font-bold font-mono"><i
                            class="fa-solid fa-terminal mr-2"></i>RUNTIME LOGS</span>

    <template id="step-template">
        <div class="step-item relative pl-14 pb-8 opacity-0 animate-fade-in-up group" data-step-id="">
            <div class="step-line group-last:hidden"></div>

            <div class="absolute left-0 top-1 w-10 h-10 flex items-center justify-center z-10">
                <div
                    class="status-bg w-10 h-10 rounded-xl bg-slate-800 border border-slate-600 flex items-center justify-center shadow-lg transition-all duration-300">
                    <i class="status-icon fa-solid fa-circle-notch fa-spin text-slate-400 text-base"></i>
                </div>
            </div>

            <div
                class="bg-slate-900 rounded-lg border border-slate-800 p-4 hover:border-slate-700 transition-colors shadow-sm relative overflow-hidden">
                <div class="flex justify-between items-start mb-2 z-10 relative">
                    <h3 class="text-sm font-bold text-slate-200 step-title tracking-wide">Step Title</h3>
                    <span
                        class="text-xs px-2.5 py-1 rounded bg-slate-800 text-slate-500 font-mono step-tag uppercase border border-slate-700 font-bold tracking-wider">WAIT</span>
                </div>
                <p class="text-xs text-slate-400 step-desc leading-relaxed">Desc...</p>
                <div class="step-chips mt-3 flex flex-wrap gap-2 hidden"></div>
            </div>
        </div>
    </template>

    <script>
        const WS_URL = "ws://localhost:8000/ws";
        let socket;

        function connect() {
            socket = new WebSocket(WS_URL);
            socket.onopen = () => { updateConnection(true); log("Backend Connected.", "text-green-500"); };
            socket.onclose = () => { updateConnection(false); log("Backend Disconnected. Retrying...", "text-red-500"); setTimeout(connect, 3000); };
            socket.onmessage = (e) => handleMessage(JSON.parse(e.data));
        }
        connect();

        function startPipeline() {
            const code = document.getElementById('matlab-input').value;
            if (!code.trim()) return alert("Code is empty");

            document.getElementById('flow-container').innerHTML = '';
            document.getElementById('terminal-content').innerHTML = '';
            log("System ready...", "text-green-500/80");

            document.getElementById('code-content').textContent = '# Waiting...';
            document.getElementById('view-blueprint').innerHTML = '';
            document.getElementById('view-ir').innerHTML = '';

            socket.send(JSON.stringify({ code }));

            const btn = document.getElementById('run-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Running...';
        }

        function handleMessage(data) {
            const { type, title, message, step_id, is_success, extra_data } = data;

            if (type === 'log') {
                let colorClass = 'text-slate-300';
                if (title === 'PERF') colorClass = 'text-indigo-400';
                else if (message.includes('[Branch')) colorClass = 'text-yellow-100/80';
                log(`[${title}] ${message}`, colorClass);
                return;
            }

            if (type === 'step_start') {
                if (step_id === 'selector') {
                    updateStep('tournament', true, 'All branches processed.', []);
                }

                if (step_id === 'tournament') {
                    addStep(step_id, title, message, 'fa-flag-checkered', true);
                } else {
                    addStep(step_id, title, message, data.icon);
                }
            }
            else if (type === 'step_done') {
                const ok = (is_success !== false);
                updateStep(step_id, ok, message, extra_data);

                const isFinished = title === 'Success' || title === 'Failed' || title === 'Verification Passed';
                if (step_id === 'finish' || type === 'fatal' || isFinished) {
                    updateStep('tournament', true, 'Completed.', []);
                    document.getElementById('run-btn').disabled = false;
                    document.getElementById('run-btn').innerHTML = '<i class="fa-solid fa-play"></i> Run Tournament';
                    log("Pipeline Finished.", ok ? "text-green-400" : "text-red-400");
                }
            }
            else if (type === 'result_ir') renderMarkdown('view-ir', message);
            else if (type === 'result_blueprint') renderMarkdown('view-blueprint', message);
            else if (type === 'result_code') {
                const el = document.getElementById('code-content');
                el.textContent = message;
                delete el.dataset.highlighted;
                hljs.highlightElement(el);
                switchTab('code');
            }
            else if (type === 'fatal') {
                log(message, 'text-red-500 font-bold');
            }
        }

        function addStep(id, title, desc, icon = "fa-circle", isHighlight = false) {
            const tpl = document.getElementById('step-template');
            const clone = tpl.content.cloneNode(true);
            const el = clone.querySelector('.step-item');
            el.id = `step-${id}`;

            el.querySelector('.step-title').textContent = title;
            el.querySelector('.step-desc').textContent = desc;

            const iconEl = el.querySelector('.status-icon');
            iconEl.className = `status-icon fa-solid ${icon} text-indigo-400 text-base ${isHighlight ? 'fa-beat-fade' : ''}`;

            const tag = el.querySelector('.step-tag');
            tag.textContent = "RUNNING";
            tag.className = "text-xs px-2.5 py-1 rounded bg-indigo-900/50 text-indigo-300 font-mono step-tag uppercase border border-indigo-500/30 animate-pulse font-bold tracking-wider";

            if (isHighlight) {
                el.querySelector('.bg-slate-900').classList.add('tournament-active');
            }

            document.getElementById('flow-container').appendChild(el);
            scrollToBottom('flow-container');
        }

        function updateStep(id, success, desc, extra) {
            const el = document.getElementById(`step-${id}`);
            if (!el) return;

            const icon = el.querySelector('.status-icon');
            const bg = el.querySelector('.status-bg');
            const tag = el.querySelector('.step-tag');
            const card = el.querySelector('.bg-slate-900');

            card.classList.remove('tournament-active');
            tag.classList.remove('animate-pulse');

            if (success) {
                icon.className = "status-icon fa-solid fa-check text-green-400 text-base";
                bg.className = "status-bg w-10 h-10 rounded-xl bg-slate-800 border border-green-500 flex items-center justify-center shadow-[0_0_10px_rgba(34,197,94,0.2)]";
                tag.textContent = "DONE";
                tag.className = "text-xs px-2.5 py-1 rounded bg-green-900/20 text-green-400 font-mono step-tag uppercase border border-green-800 font-bold tracking-wider";
            }
            else {
                icon.className = "status-icon fa-solid fa-xmark text-red-400 text-base";
                bg.className = "status-bg w-10 h-10 rounded-xl bg-slate-800 border border-red-500 flex items-center justify-center shadow-[0_0_10px_rgba(239,68,68,0.2)]";
                tag.textContent = "FAIL";
                tag.className = "text-xs px-2.5 py-1 rounded bg-red-900/20 text-red-400 font-mono step-tag uppercase border border-red-800 font-bold tracking-wider";
            }

            if (desc) el.querySelector('.step-desc').textContent = desc;

            if (extra && Array.isArray(extra) && extra.length > 0) {
                const chips = el.querySelector('.step-chips');
                chips.innerHTML = '';
                chips.classList.remove('hidden');
                extra.forEach(item => {
                    const span = document.createElement('span');
                    span.className = "px-2 py-0.5 bg-slate-800 text-slate-300 rounded text-[10px] border border-slate-700 font-mono";
                    span.innerHTML = `<i class="fa-solid fa-bug mr-1 text-slate-500"></i>${item}`;
                    chips.appendChild(span);
                });
            }
        }

        function log(msg, cls = "text-slate-300") {
            const box = document.getElementById('terminal-content');
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });
            box.innerHTML += `<div class="break-words hover:bg-white/5 py-0.5"><span class="text-slate-600 mr-2">[${time}]</span><span class="${cls}">${msg}</span></div>`;
            scrollToBottom('terminal-content');
        }

        function switchTab(t) {
            ['code', 'blueprint', 'ir'].forEach(k => {
                document.getElementById(`view-${k}`).classList.add('hidden');
                const btn = document.getElementById(`tab-${k}`);
                btn.classList.remove('text-indigo-400', 'border-indigo-500', 'bg-slate-800');
                btn.classList.add('text-slate-500', 'border-transparent');
            });
            document.getElementById(`view-${t}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${t}`);
            activeBtn.classList.remove('text-slate-500', 'border-transparent');
            activeBtn.classList.add('text-indigo-400', 'border-indigo-500', 'bg-slate-800');
        }

        function renderMarkdown(id, md) {
            document.getElementById(id).innerHTML = `<div class="markdown-view">${marked.parse(md)}</div>`;
        }

        function scrollToBottom(id) {
            const el = document.getElementById(id);
            el.scrollTop = el.scrollHeight;
        }

        function updateConnection(ok) {
            const badge = document.getElementById('connection-badge');
            const dot = document.getElementById('connection-dot');
            const text = document.getElementById('connection-text');
            if (ok) {
                badge.className = "flex items-center gap-2 px-3 py-1.5 bg-green-900/20 border border-green-800 rounded-full";
                dot.className = "w-2 h-2 rounded-full bg-green-500 animate-pulse";
                text.className = "text-xs font-mono text-green-400 font-bold";
                text.textContent = "ONLINE";
            } else {
                badge.className = "flex items-center gap-2 px-3 py-1.5 bg-red-900/20 border border-red-800 rounded-full";
                dot.className = "w-2 h-2 rounded-full bg-red-500";
                text.className = "text-xs font-mono text-red-400 font-bold";
                text.textContent = "OFFLINE";
            }
        }

        async function copyCurrentTab() {
            let content = "";
            if (!document.getElementById('view-code').classList.contains('hidden')) {
                content = document.getElementById('code-content').textContent;
            } else if (!document.getElementById('view-blueprint').classList.contains('hidden')) {
                content = document.getElementById('view-blueprint').innerText;
            } else {
                content = document.getElementById('view-ir').innerText;
            }
            if (!content) return;

            const btn = document.getElementById('copy-btn');
            const icon = btn.querySelector('i');

            try {
                await navigator.clipboard.writeText(content);
                showSuccess();
            } catch (err) {
                try {
                    const textArea = document.createElement("textarea");
                    textArea.value = content;
                    textArea.style.position = "fixed";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    const successful = document.execCommand('copy');
                    document.body.removeChild(textArea);
                    if (successful) showSuccess();
                    else alert("Copy failed.");
                } catch (e) {
                    alert("Copy failed.");
                }
            }

            function showSuccess() {
                icon.className = "fa-solid fa-check";
                btn.classList.add('bg-green-600', 'hover:bg-green-500');
                btn.classList.remove('bg-indigo-600', 'hover:bg-indigo-500');
                setTimeout(() => {
                    icon.className = "fa-regular fa-copy";
                    btn.classList.add('bg-indigo-600', 'hover:bg-indigo-500');
                    btn.classList.remove('bg-green-600', 'hover:bg-green-500');
                }, 2000);
            }
        }

        function initResizers() {
            const mainContainer = document.getElementById('main-container');

            const resizerLeft = document.getElementById('resizer-left');
            const panelLeft = document.getElementById('panel-left');

            makeResizable(resizerLeft, (deltaX, deltaY) => {
                const newWidth = panelLeft.offsetWidth + deltaX;
                if (newWidth > 200 && newWidth < mainContainer.offsetWidth - 600) {
                    panelLeft.style.width = `${newWidth}px`;
                }
            }, 'col');

            const resizerRight = document.getElementById('resizer-right');
            const panelMiddle = document.getElementById('panel-middle');

            makeResizable(resizerRight, (deltaX, deltaY) => {
                const newWidth = panelMiddle.offsetWidth + deltaX;
                if (newWidth > 250 && newWidth < mainContainer.offsetWidth - panelLeft.offsetWidth - 250) {
                    panelMiddle.style.width = `${newWidth}px`;
                }
            }, 'col');

            const resizerMiddle = document.getElementById('resizer-middle');
            const panelMiddleTop = document.getElementById('panel-middle-top');
            const panelMiddleContainer = document.getElementById('panel-middle');

            makeResizable(resizerMiddle, (deltaX, deltaY) => {
                const newHeight = panelMiddleTop.offsetHeight + deltaY;
                if (newHeight > 100 && newHeight < panelMiddleContainer.offsetHeight - 100) {
                    panelMiddleTop.style.height = `${newHeight}px`;
                }
            }, 'row');
        }

        function makeResizable(resizer, onResize, direction) {
            let startX = 0;
            let startY = 0;

            const onMouseDown = (e) => {
                startX = e.clientX;
                startY = e.clientY;

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);

                resizer.classList.add('resizing');
                document.body.classList.add(direction === 'col' ? 'resizing' : 'resizing-row');
            };

            const onMouseMove = (e) => {
                const deltaX = e.clientX - startX;
                const deltaY = e.clientY - startY;

                onResize(deltaX, deltaY);

                startX = e.clientX;
                startY = e.clientY;
            };

            const onMouseUp = () => {
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);

                resizer.classList.remove('resizing');
                document.body.classList.remove('resizing', 'resizing-row');
                document.body.classList.remove('resizing');
            };

            resizer.addEventListener('mousedown', onMouseDown);
        }

        initResizers();
    </script>
</body>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvoCoder v1.2 | Auto-Repair Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600&display=swap');

        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; }
        .code-font { font-family: 'JetBrains Mono', monospace; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .step-line { position: absolute; left: 24px; top: 40px; bottom: -20px; width: 2px; background-color: #334155; z-index: 0; }
        .step-item:last-child .step-line { display: none; }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }

        /* --- Markdown 渲染样式 (Dark Mode) --- */
        .markdown-view {
            padding: 1.5rem;
            line-height: 1.6;
            color: #cbd5e1;
        }
        .markdown-view h1 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-top: 1.5rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #334155; }
        .markdown-view h2 { font-size: 1.25rem; font-weight: 600; color: #f1f5f9; margin-top: 1.5rem; margin-bottom: 0.75rem; }
        .markdown-view h3 { font-size: 1.1rem; font-weight: 600; color: #e2e8f0; margin-top: 1rem; margin-bottom: 0.5rem; }

        .markdown-view ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-view ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1rem; }
        .markdown-view li { margin-bottom: 0.25rem; }

        .markdown-view p { margin-bottom: 1rem; }
        .markdown-view strong { color: #60a5fa; font-weight: 600; }

        /* 表格样式优化 */
        .markdown-view table { width: 100%; border-collapse: collapse; margin: 1rem 0; background-color: #1e293b; border-radius: 0.5rem; overflow: hidden; }
        .markdown-view th { background-color: #0f172a; color: #94a3b8; font-weight: 600; text-align: left; padding: 0.75rem 1rem; border-bottom: 1px solid #334155; }
        .markdown-view td { padding: 0.75rem 1rem; border-bottom: 1px solid #334155; color: #cbd5e1; font-size: 0.9em; }
        .markdown-view tr:last-child td { border-bottom: none; }
        .markdown-view tr:hover { background-color: #334155; }

        /* 代码块样式 */
        .markdown-view code { background-color: #334155; color: #e2e8f0; padding: 0.2rem 0.4rem; rounded: 0.25rem; font-family: 'JetBrains Mono', monospace; font-size: 0.85em; }
        .markdown-view pre { background-color: #0f172a; padding: 1rem; rounded: 0.5rem; overflow-x: auto; margin-bottom: 1rem; border: 1px solid #334155; }
        .markdown-view pre code { background-color: transparent; padding: 0; color: inherit; }

        /* 引用块 */
        .markdown-view blockquote { border-left: 4px solid #3b82f6; padding-left: 1rem; color: #94a3b8; font-style: italic; margin-bottom: 1rem; }

        /* 链接 */
        .markdown-view a { color: #60a5fa; text-decoration: underline; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <header class="bg-slate-800 border-b border-slate-700 h-16 flex items-center justify-between px-6 shadow-lg z-10">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-r from-blue-600 to-indigo-600 w-8 h-8 rounded-lg flex items-center justify-center shadow-lg shadow-blue-500/30">
                <i class="fa-solid fa-dna text-white"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-wide text-white">EvoCoder <span class="text-indigo-400">Canvas</span></h1>
                <p class="text-xs text-slate-400">Powered by Agentic Workflow</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div id="connection-badge" class="flex items-center gap-2 px-3 py-1 bg-red-900/30 border border-red-700 rounded-full transition-colors duration-300">
                <div id="connection-dot" class="w-2 h-2 rounded-full bg-red-500"></div>
                <span id="connection-text" class="text-xs font-mono text-red-300">DISCONNECTED</span>
            </div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">

        <section class="w-1/3 min-w-[350px] flex flex-col border-r border-slate-700 bg-slate-900/50">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h2 class="text-sm font-semibold text-slate-200"><i class="fa-brands fa-python mr-2"></i>Input (MATLAB)</h2>
            </div>
            <div class="flex-1 relative">
                <textarea id="matlab-input" class="w-full h-full bg-slate-950 p-4 text-sm code-font text-slate-300 focus:outline-none resize-none" spellcheck="false" placeholder="Paste your MATLAB code here...">
function [Pop, Fit] = MyMOEA(Global)
    % Initialize
    Pop = Global.upper - (Global.upper - Global.lower) .* rand(Global.N, Global.D);
    Fit = CalFit(Pop);

    % Main Loop
    for t = 1 : Global.MaxIter
        % Mating Selection using Crowding Distance
        [FrontNo, MaxFNo] = NDSort(Pop.objs, Global.N);
        CrowdDis = CrowdingDistance(Pop.objs, FrontNo);
        MatingPool = TournamentSelection(2, Global.N, FrontNo, CrowdDis);

        Offspring  = OperatorGA(Pop(MatingPool,:));
        [Pop, Fit] = EnvironmentalSelection([Pop; Offspring], Global.N);
    end
end
</textarea>
            </div>
            <div class="p-4 border-t border-slate-700 bg-slate-800">
                <button id="run-btn" onclick="startPipeline()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg shadow-lg shadow-indigo-600/20 transition-all flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-play"></i> Start Pipeline
                </button>
            </div>
        </section>

        <section class="w-1/3 min-w-[350px] flex flex-col border-r border-slate-700 bg-slate-900">
            <div class="p-4 border-b border-slate-700 bg-slate-800/50 backdrop-blur">
                <h2 class="text-sm font-semibold text-slate-200">Execution Trace</h2>
            </div>
            <div class="flex-1 overflow-y-auto p-6 relative" id="flow-container">
                <div class="flex flex-col items-center justify-center h-full text-slate-500 opacity-50" id="empty-state">
                    <i class="fa-solid fa-microchip text-4xl mb-3"></i>
                    <p class="text-sm">Ready to synthesize</p>
                </div>
            </div>
            <div class="h-32 border-t border-slate-700 bg-black p-3 font-mono text-xs overflow-y-auto" id="terminal">
                <div class="text-green-500">user@evocoder:~$ <span class="text-slate-400">system ready...</span></div>
            </div>
        </section>

        <section class="w-1/3 min-w-[400px] flex flex-col bg-slate-950">
            <div class="flex border-b border-slate-800 bg-slate-900">
                <button id="tab-code" class="tab-btn flex-1 px-4 py-3 text-xs font-semibold text-blue-400 border-b-2 border-blue-400 bg-slate-800" onclick="switchTab('code')">Code (.py)</button>
                <button id="tab-blueprint" class="tab-btn flex-1 px-4 py-3 text-xs font-semibold text-slate-500 hover:text-slate-300" onclick="switchTab('blueprint')">Blueprint (MD)</button>
                <button id="tab-ir" class="tab-btn flex-1 px-4 py-3 text-xs font-semibold text-slate-500 hover:text-slate-300" onclick="switchTab('ir')">Analyst Report</button>
            </div>

            <div class="flex-1 relative overflow-hidden">
                <div id="view-code" class="absolute inset-0 p-0 overflow-auto code-font text-sm bg-[#282c34]">
                    <pre><code id="code-content" class="language-python h-full p-4"># Generated code will appear here...</code></pre>
                </div>

                <div id="view-blueprint" class="absolute inset-0 overflow-auto bg-slate-950 hidden">
                    <div class="text-slate-500 italic text-center mt-10">Blueprint pending...</div>
                </div>

                <div id="view-ir" class="absolute inset-0 overflow-auto bg-slate-950 hidden">
                    <div class="text-slate-500 italic text-center mt-10">Analysis Report pending...</div>
                </div>
            </div>

            <button onclick="copyCurrentTab()" class="absolute bottom-6 right-6 bg-slate-700/80 hover:bg-slate-600 text-white p-2 rounded-lg shadow-lg backdrop-blur z-20" title="Copy Content">
                <i class="fa-regular fa-copy"></i>
            </button>
        </section>
    </main>

    <template id="step-template">
        <div class="step-item relative pl-12 pb-8 opacity-0 animate-fade-in-up" data-step-id="">
            <div class="step-line"></div>
            <div class="absolute left-0 top-0 w-12 h-12 flex items-center justify-center z-10">
                <div class="status-bg w-10 h-10 rounded-xl bg-slate-800 border border-slate-600 flex items-center justify-center shadow-lg transition-all duration-300">
                    <i class="status-icon fa-solid fa-circle text-slate-400 text-sm"></i>
                </div>
            </div>
            <div class="bg-slate-800/40 rounded-lg p-3 border border-slate-700/50">
                <div class="flex justify-between items-start mb-1">
                    <h3 class="text-sm font-bold text-slate-200 step-title">Step Title</h3>
                    <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-700 text-slate-400 step-tag">PENDING</span>
                </div>
                <p class="text-xs text-slate-400 step-desc mb-2">Desc...</p>
                </div>
        </div>
    </template>

    <script>
        // --- WebSocket Configuration ---
        const WS_URL = "ws://localhost:8000/ws";
        let socket;

        function connect() {
            socket = new WebSocket(WS_URL);

            socket.onopen = () => {
                updateConnectionStatus(true);
                log("Connected to EvoCoder Backend.", "text-green-400");
            };

            socket.onclose = () => {
                updateConnectionStatus(false);
                log("Disconnected from backend. Retrying in 5s...", "text-red-400");
                setTimeout(connect, 5000);
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                handleServerMessage(data);
            };
        }

        connect();

        // --- Core Logic ---

        function startPipeline() {
            const code = document.getElementById('matlab-input').value;
            if(!code.trim()) { alert("Please enter MATLAB code."); return; }

            document.getElementById('flow-container').innerHTML = '';

            // Reset Views
            document.getElementById('code-content').textContent = '# Waiting for pipeline...';
            document.getElementById('view-blueprint').innerHTML = '<div class="text-slate-500 italic text-center mt-10">Processing...</div>';
            document.getElementById('view-ir').innerHTML = '<div class="text-slate-500 italic text-center mt-10">Processing...</div>';

            if(socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ code: code }));
                const btn = document.getElementById('run-btn');
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';
            } else {
                alert("Backend disconnected! Please ensure main.py is running.");
            }
        }

        // --- Message Handler (The Brain) ---
        function handleServerMessage(data) {
            const { type, title, message, step_id, extra_data, is_success } = data;

            if (type === 'step_start') {
                addStepUI(step_id, title, message, data.icon || 'fa-circle-notch');
            }
            else if (type === 'step_done') {
                const color = is_success === false ? 'text-red-400' : 'text-green-400';
                const bgColor = is_success === false ? 'bg-red-900/30' : 'bg-green-900/30';
                const statusText = is_success === false ? 'FAILED' : 'DONE';

                updateStepStatus(step_id, statusText, color, bgColor);

                if (step_id === 'rag' && extra_data && extra_data.length > 0) {
                    addRagChips(step_id, extra_data);
                }

                // --- 核心修改：适配新的 6 步流程结束判断 ---
                // 后端成功消息 Title 变成了 "Success"
                // 后端失败消息 Title 变成了 "Failed" (Max Retries)
                // 兼容旧的 "Verification Passed"
                const isFinished = title === 'Success' || title === 'Failed' || title === 'Verification Passed';

                if (isFinished) {
                    resetButton();
                    const isSuccess = title === 'Success' || title === 'Verification Passed';
                    const logMsg = isSuccess ? "Pipeline Completed Successfully." : "Pipeline Finished: Execution Failed.";
                    const logClass = isSuccess ? "text-green-400 font-bold" : "text-red-400 font-bold";
                    log(logMsg, logClass);
                }
            }
            // Markdown 渲染
            else if (type === 'result_ir') {
                renderOutput('view-ir', message, 'markdown');
            }
            else if (type === 'result_blueprint') {
                renderOutput('view-blueprint', message, 'markdown');
                switchTab('blueprint');
            }
            else if (type === 'result_code') {
                const codeBlock = document.getElementById('code-content');
                codeBlock.textContent = message;
                delete codeBlock.dataset.highlighted;
                hljs.highlightElement(codeBlock);
                switchTab('code'); // 自动切换到代码 Tab
            }
            else if (type === 'log') {
                log(`[${title}] ${message}`);
            }
            else if (type === 'fatal') {
                log(message, "text-red-500 font-bold");
                resetButton();
            }
        }

        // --- UI Helpers ---

        function switchTab(tab) {
            ['code', 'blueprint', 'ir'].forEach(t => document.getElementById(`view-${t}`).classList.add('hidden'));
            document.getElementById(`view-${tab}`).classList.remove('hidden');

            ['code', 'blueprint', 'ir'].forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                if (t === tab) {
                    btn.className = "tab-btn flex-1 px-4 py-3 text-xs font-semibold text-blue-400 border-b-2 border-blue-400 bg-slate-800 transition-colors";
                } else {
                    btn.className = "tab-btn flex-1 px-4 py-3 text-xs font-semibold text-slate-500 hover:text-slate-300 transition-colors";
                }
            });
        }

        function renderOutput(id, content, type) {
            const el = document.getElementById(id);
            if (type === 'json') {
                try {
                    const jsonObj = typeof content === 'string' ? JSON.parse(content) : content;
                    const html = `<pre class="text-xs p-4 code-font">${JSON.stringify(jsonObj, null, 2)}</pre>`;
                    el.innerHTML = html;
                } catch(e) {
                    el.textContent = content;
                }
            }
            else if (type === 'markdown') {
                el.innerHTML = `<div class="markdown-view">${marked.parse(content)}</div>`;
            }
            else {
                el.textContent = content;
            }
        }

        function addStepUI(id, title, desc, icon) {
            const container = document.getElementById('flow-container');
            const template = document.getElementById('step-template');
            const clone = template.content.cloneNode(true);
            const el = clone.querySelector('.step-item');

            el.id = `step-${id}`;
            el.querySelector('.step-title').innerText = title;
            el.querySelector('.step-desc').innerText = desc;
            el.querySelector('.status-icon').className = `status-icon fa-solid ${icon} text-blue-400 text-sm`;
            el.querySelector('.status-bg').className = "status-bg w-10 h-10 rounded-xl bg-slate-800 border border-blue-500/50 flex items-center justify-center shadow-lg animate-pulse";

            el.querySelector('.step-tag').innerText = "RUNNING";
            el.querySelector('.step-tag').className = "text-[10px] px-1.5 py-0.5 rounded bg-blue-900 text-blue-300 step-tag";

            container.appendChild(clone);
            container.scrollTop = container.scrollHeight;
        }

        function updateStepStatus(id, status, textColorClass, bgColorClass) {
            const el = document.getElementById(`step-${id}`);
            if(!el) return;

            el.querySelector('.status-bg').classList.remove('animate-pulse');
            el.querySelector('.status-bg').classList.remove('border-blue-500/50');
            el.querySelector('.status-bg').classList.add('border-slate-600');

            const tag = el.querySelector('.step-tag');
            tag.innerText = status;
            tag.className = `step-tag text-[10px] px-1.5 py-0.5 rounded ${bgColorClass || 'bg-slate-700'} ${textColorClass}`;
        }

        function addRagChips(stepId, rules) {
            const el = document.getElementById(`step-${stepId}`);
            const chipContainer = document.createElement('div');
            chipContainer.className = "flex flex-wrap gap-2 mt-2";

            rules.forEach(rule => {
                const chip = document.createElement('div');
                chip.className = "text-[10px] bg-indigo-900/50 text-indigo-300 px-2 py-1 rounded border border-indigo-500/30 flex items-center gap-1";
                chip.innerHTML = `<i class="fa-solid fa-bug"></i> ${rule}`;
                chipContainer.appendChild(chip);
            });

            el.querySelector('.bg-slate-800\\/40').appendChild(chipContainer);
        }

        function log(msg, cls="text-slate-300") {
            const t = document.getElementById('terminal');
            t.innerHTML += `<div class="mb-1 break-words"><span class="text-slate-500 mr-2">[${new Date().toLocaleTimeString()}]</span><span class="${cls}">${msg}</span></div>`;
            t.scrollTop = t.scrollHeight;
        }

        function updateConnectionStatus(connected) {
            const badge = document.getElementById('connection-badge');
            const dot = document.getElementById('connection-dot');
            const text = document.getElementById('connection-text');

            if(connected) {
                badge.className = "flex items-center gap-2 px-3 py-1 bg-green-900/30 border border-green-700 rounded-full transition-colors duration-300";
                dot.className = "w-2 h-2 rounded-full bg-green-500 animate-pulse";
                text.className = "text-xs font-mono text-green-300";
                text.innerText = "CONNECTED";
            } else {
                badge.className = "flex items-center gap-2 px-3 py-1 bg-red-900/30 border border-red-700 rounded-full transition-colors duration-300";
                dot.className = "w-2 h-2 rounded-full bg-red-500";
                text.className = "text-xs font-mono text-red-300";
                text.innerText = "DISCONNECTED";
            }
        }

        function resetButton() {
            const btn = document.getElementById('run-btn');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-play"></i> Start Pipeline';
        }

        function copyCurrentTab() {
            let content = "";
            if(!document.getElementById('view-code').classList.contains('hidden')) {
                content = document.getElementById('code-content').textContent;
            } else if (!document.getElementById('view-blueprint').classList.contains('hidden')) {
                content = document.getElementById('view-blueprint').innerText;
            } else {
                content = document.getElementById('view-ir').innerText;
            }

            if(content) {
                navigator.clipboard.writeText(content);
                alert("Content copied to clipboard!");
            }
        }
    </script>
</body>
</html>

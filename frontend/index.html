    <script>
        const initialScript = `classdef NSGAIISDR < ALGORITHM
% <2019> <many> <real/integer/label/binary/permutation>
% NSGA-II with strengthened dominance relation

    methods
        function main(Algorithm,Problem)
            %% Initialization: Create initial population
            Population = Problem.Initialization();
            zmin       = min(Population.objs,[],1);
            zmax       = max(Population.objs,[],1);
            [~,FrontNo,CrowdDis] = EnvironmentalSelection(Population,Problem.N,zmin,zmax);

            %% Optimization Loop
            while Algorithm.NotTerminated(Population)
                MatingPool = TournamentSelection(2,Problem.N,FrontNo,-CrowdDis);
                Offspring  = OperatorGA(Problem,Population(MatingPool));
                zmin       = min([zmin;Offspring.objs],[],1);
                zmax       = max(Population(FrontNo==1).objs,[],1);
                [Population,FrontNo,CrowdDis] = EnvironmentalSelection([Population,Offspring],Problem.N,zmin,zmax);
            end
        end
    end
end

function [FrontNo,MaxFNo] = NDSort_SDR(PopObj,nSort)
% Non-dominated sorting based on SDR
    N      = size(PopObj,1);
    NormP  = sum(PopObj,2);
    cosine = 1 - pdist2(PopObj,PopObj,'cosine');
    cosine(logical(eye(length(cosine)))) = 0;
    Angle  = acos(cosine);

    temp  = sort(unique(min(Angle,[],2)));
    minA  = temp(min(ceil(N/2),end));
    Theta = max(1,(Angle./minA).^1);

    dominate = false(N);
    for i = 1 : N-1
        for j = i+1 : N
            if NormP(i)*Theta(i,j) < NormP(j)
                dominate(i,j) = true;
            elseif NormP(j)*Theta(j,i) < NormP(i)
                dominate(j,i) = true;
            end
        end
    end

    FrontNo = inf(1,N);
    MaxFNo  = 0;
    while sum(FrontNo~=inf) < min(nSort,N)
        MaxFNo  = MaxFNo + 1;
        current = ~any(dominate,1) & FrontNo==inf;
        FrontNo(current)    = MaxFNo;
        dominate(current,:) = false;
    end
end

function [Population,FrontNo,CrowdDis] = EnvironmentalSelection(Population,N,zmin,zmax)
% Selection logic for NSGA-II
    %% Normalize Objective values
    PopObj = Population.objs - repmat(zmin,length(Population),1);
    range  = zmax - zmin;
    if 0.05*max(range) < min(range)
        PopObj = PopObj./repmat(range,length(Population),1);
    end
    [~,x]      = unique(round(PopObj*1e6)/1e6,'rows');
    PopObj     = PopObj(x,:);
    Population = Population(x);
    N          = min(N,length(Population));

    %% Ranking via Sorting
    [FrontNo,MaxFNo] = NDSort_SDR(PopObj,N);
    Next = FrontNo < MaxFNo;

    %% Density Calculations
    CrowdDis = CrowdingDistance(PopObj,FrontNo);

    %% Finalize next population
    Last     = find(FrontNo==MaxFNo);
    [~,Rank] = sort(CrowdDis(Last),'descend');
    Next(Last(Rank(1:N-sum(Next)))) = true;

    Population = Population(Next);
    FrontNo    = FrontNo(Next);
    CrowdDis   = CrowdDis(Next);
end`;

        function handleInput() {
            const input = document.getElementById('source-input');
            const overlay = document.querySelector('#highlight-overlay code');
            let content = input.value;
            content = content.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            if (content[content.length - 1] === "\n") content += " ";
            overlay.innerHTML = content;
            hljs.highlightElement(overlay);
            updateLineNumbers();
            syncScroll();
        }

        function updateLineNumbers() {
            const input = document.getElementById('source-input');
            const lines = input.value.split('\n').length;
            let nums = '';
            for (let i = 1; i <= lines; i++) nums += i + '<br>';
            document.getElementById('line-numbers').innerHTML = nums;
        }

        function syncScroll() {
            const input = document.getElementById('source-input');
            const overlay = document.getElementById('highlight-overlay');
            const lineNumbers = document.getElementById('line-numbers');
            overlay.scrollTop = input.scrollTop;
            overlay.scrollLeft = input.scrollLeft;
            lineNumbers.scrollTop = input.scrollTop;
        }

        window.onload = () => {
            document.getElementById('source-input').value = initialScript;
            handleInput();
            initResizers();
            connect();
        };

        const WS_URL = "ws://localhost:8000/ws";
        let socket;

        function connect() {
            socket = new WebSocket(WS_URL);
            socket.onopen = () => { updateConnection(true); log("SYSTEM: Secure bridge established.", "text-emerald-500 font-black"); };
            socket.onclose = () => { updateConnection(false); log("CRITICAL: Link severed. Attempting reconnect...", "text-rose-500"); setTimeout(connect, 3000); };
            socket.onmessage = (e) => handleMessage(JSON.parse(e.data));
            socket.onerror = (err) => { log("SYSTEM: Node sync error detected.", "text-rose-500 font-bold"); };
        }

        function startPipeline() {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                log("WARNING: Engine is initializing. Please retry in a moment.", "text-amber-500 font-black");
                if (!socket || socket.readyState === WebSocket.CLOSED) connect();
                return;
            }

            const code = document.getElementById('source-input').value;
            if (!code.trim()) return;

            document.getElementById('flow-container').innerHTML = '';
            document.getElementById('terminal-content').innerHTML = '';
            log("PIPELINE: Initiation detected. Scaling agent parameters...", "text-indigo-600 dark:text-indigo-400 font-black");
            document.getElementById('code-content').textContent = '# Materializing stream...';

            socket.send(JSON.stringify({ code }));

            // UI Transition: Increased Height and Proportions
            const btn = document.getElementById('run-btn');
            const stopBtn = document.getElementById('stop-btn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin text-2xl"></i> Processing...';
            stopBtn.classList.replace('hidden', 'flex');
        }

        function stopPipeline() {
            if (socket) {
                socket.close();
                log("TERMINATION: Manual override detected. Process killed.", "text-rose-600 font-black uppercase tracking-widest");
                resetUI();
            }
        }

        function resetUI() {
            const btn = document.getElementById('run-btn');
            const stopBtn = document.getElementById('stop-btn');
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-play-circle text-2xl"></i> Run Agent';
            stopBtn.classList.replace('flex', 'hidden');
        }

        function handleMessage(data) {
            const { type, title, message, step_id, is_success, extra_data } = data;

            if (type === 'log') {
                let colorClass = 'text-slate-500';
                const lowerMsg = message.toLowerCase();
                if (title === 'PERF') colorClass = 'text-primary-500 font-black';
                else if (lowerMsg.includes('failed') || lowerMsg.includes('error')) colorClass = 'text-rose-500 font-black';
                else if (lowerMsg.includes('success') || lowerMsg.includes('passed') || lowerMsg.includes('done')) colorClass = 'text-emerald-500 font-black uppercase tracking-tight';
                else if (lowerMsg.includes('warning')) colorClass = 'text-amber-500 font-bold';
                else if (lowerMsg.includes('pipeline') || lowerMsg.includes('system')) colorClass = 'text-indigo-600 dark:text-indigo-400 font-bold';
                log(`[${title}] ${message}`, colorClass);
                return;
            }

            if (type === 'step_start') {
                if (step_id === 'selector') updateStep('tournament', true, 'Synchronization locked.');
                addStep(step_id, title, message, data.icon || 'fa-microchip', step_id === 'tournament');
            }
            else if (type === 'step_done') {
                const ok = (is_success !== false);
                updateStep(step_id, ok, message, extra_data);
                if (step_id === 'finish' || type === 'fatal' || title === 'Success' || title === 'Failed') {
                    resetUI();
                    log("PIPELINE: Terminal state reached.", ok ? "text-emerald-500 font-black" : "text-rose-500 font-black");
                }
            }
            else if (type === 'result_ir') { renderMarkdown('view-ir', message); switchTab('ir'); }
            else if (type === 'result_blueprint') { renderMarkdown('view-blueprint', message); switchTab('blueprint'); }
            else if (type === 'result_code') {
                const el = document.getElementById('code-content');
                el.textContent = message;
                delete el.dataset.highlighted;
                hljs.highlightElement(el);
                switchTab('code');
            }
        }

        async function renderMarkdown(id, md) {
            const container = document.getElementById(id);
            container.innerHTML = `
                <div class="p-12 prose dark:prose-invert prose-sm max-w-none 
                            prose-headings:text-indigo-600 dark:prose-headings:text-indigo-400 
                            prose-headings:font-black prose-headings:tracking-tighter
                            prose-strong:text-slate-900 dark:prose-strong:text-slate-100
                            prose-code:text-indigo-600 dark:prose-code:text-primary-400 prose-code:bg-indigo-50 dark:prose-code:bg-indigo-900/20 prose-code:px-2 prose-code:rounded-lg
                            animate-step">
                    ${marked.parse(md)}
                </div>
            `;
            if (window.MathJax && MathJax.typesetPromise) await MathJax.typesetPromise([container]);
        }

        function addStep(id, title, desc, icon = "fa-circle", isHighlight = false) {
            document.getElementById('empty-state')?.classList.add('opacity-0');
            setTimeout(() => document.getElementById('empty-state')?.classList.add('hidden'), 400);
            const tpl = document.getElementById('step-template');
            const clone = tpl.content.cloneNode(true);
            const el = clone.querySelector('.step-item');
            el.id = `step-${id}`;
            el.querySelector('.step-title').textContent = title;
            el.querySelector('.step-desc').textContent = desc;
            el.querySelector('.status-icon').className = `status-icon fa-solid ${icon} text-indigo-500 text-lg ${isHighlight ? 'fa-beat' : ''}`;
            document.getElementById('flow-container').appendChild(el);
            scrollToBottom('flow-container');
        }

        function updateStep(id, success, desc, extra) {
            const el = document.getElementById(`step-${id}`);
            if (!el) return;
            const icon = el.querySelector('.status-icon');
            const bg = el.querySelector('.status-bg');
            const tag = el.querySelector('.step-tag');
            if (success) {
                icon.className = "status-icon fa-solid fa-check text-emerald-500 text-lg";
                bg.classList.add('border-emerald-500/50', 'shadow-[0_0_20px_rgba(16,185,129,0.2)]');
                tag.textContent = "SUCCESS";
                tag.className = "text-[10px] px-3.5 py-1.5 rounded-lg bg-emerald-50 text-emerald-600 dark:bg-emerald-900/25 dark:text-emerald-400 font-black uppercase tracking-widest";
            } else {
                icon.className = "status-icon fa-solid fa-bolt text-rose-500 text-lg";
                bg.classList.add('border-rose-500/50', 'shadow-[0_0_20px_rgba(244,63,94,0.2)]');
                tag.textContent = "FAILED";
                tag.className = "text-[10px] px-3.5 py-1.5 rounded-lg bg-rose-50 text-rose-600 dark:bg-rose-900/25 dark:text-rose-400 font-black uppercase tracking-widest";
            }
            if (desc) el.querySelector('.step-desc').textContent = desc;
        }

        const MAX_LOG_LINES = 300;
        function log(msg, cls = "") {
            const box = document.getElementById('terminal-content');
            const time = new Date().toLocaleTimeString('en-US', { hour12: false });

            const div = document.createElement('div');
            div.className = "flex gap-4 py-2 border-b border-transparent group hover:bg-black/5 dark:hover:bg-white/5 transition-colors";
            div.innerHTML = `<span class="opacity-15 select-none tracking-tighter font-black text-[10px]">[${time}]</span><span class="${cls}">${msg}</span>`;

            box.appendChild(div);

            // Limit log lines to reduce browser DOM freezing
            while (box.children.length > MAX_LOG_LINES) {
                box.removeChild(box.firstChild);
            }

            scrollToBottom('terminal-content');
        }

        function switchTab(t) {
            ['code', 'blueprint', 'ir'].forEach(k => {
                document.getElementById(`view-${k}`).classList.add('hidden');
                document.getElementById(`tab-${k}`).className = "tab-btn flex-1 px-6 py-6 text-sm font-black uppercase tracking-[0.25em] text-slate-400 border-transparent hover:text-slate-600 dark:hover:text-slate-200 transition-all flex items-center justify-center gap-3";
            });
            document.getElementById(`view-${t}`).classList.remove('hidden');
            document.getElementById(`tab-${t}`).className = "tab-btn flex-1 px-6 py-6 text-sm font-black uppercase tracking-[0.25em] transition-all flex items-center justify-center gap-3 tab-active";
        }

        function scrollToBottom(id) { const el = document.getElementById(id); el.scrollTo({ top: el.scrollHeight, behavior: 'smooth' }); }

        function updateConnection(ok) {
            const dot = document.getElementById('connection-dot');
            const text = document.getElementById('connection-text');
            if (ok) {
                dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_12px_#10b981] animate-pulse";
                text.textContent = "Link-Active";
                text.className = "text-[11px] font-black font-mono text-emerald-600 dark:text-emerald-400 tracking-widest uppercase";
            } else {
                dot.className = "w-2.5 h-2.5 rounded-full bg-rose-500 shadow-[0_0_12px_#f43f5e]";
                text.textContent = "Link-Inactive";
                text.className = "text-[11px] font-black font-mono text-slate-500 dark:text-slate-400 tracking-widest uppercase";
            }
        }

        async function copyCurrentTab() {
            let content = "";
            if (!document.getElementById('view-code').classList.contains('hidden')) content = document.getElementById('code-content').textContent;
            else if (!document.getElementById('view-blueprint').classList.contains('hidden')) content = document.getElementById('view-blueprint').innerText;
            else content = document.getElementById('view-ir').innerText;
            if (!content) return;
            try {
                await navigator.clipboard.writeText(content);
                const btn = document.getElementById('copy-btn');
                const icon = btn.querySelector('i');
                icon.className = "fa-solid fa-check text-emerald-600";
                setTimeout(() => { icon.className = "fa-regular fa-copy"; }, 2000);
            } catch (err) { console.error("Copy failed"); }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('theme-icon');
            const hljsTheme = document.getElementById('hljs-theme-dark');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                icon.className = 'fa-solid fa-sun';
                if (hljsTheme) hljsTheme.href = "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-light.min.css";
            }
            else {
                html.classList.remove('light');
                html.classList.add('dark');
                icon.className = 'fa-solid fa-moon';
                if (hljsTheme) hljsTheme.href = "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css";
            }
        }

        function initResizers() {
            const makeResizable = (resizer, onResize, dir) => {
                let startPos = 0;
                resizer.addEventListener('mousedown', (e) => {
                    startPos = dir === 'col' ? e.clientX : e.clientY;
                    resizer.classList.add('resizing');
                    const onMove = (me) => {
                        const delta = (dir === 'col' ? me.clientX : me.clientY) - startPos;
                        onResize(delta);
                        startPos = dir === 'col' ? me.clientX : me.clientY;
                    };
                    const onUp = () => { resizer.classList.remove('resizing'); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                });
            };
            makeResizable(document.getElementById('resizer-left'), (d) => { const el = document.getElementById('panel-left'); const w = el.offsetWidth + d; if (w > 250 && w < window.innerWidth - 400) el.style.width = w + 'px'; }, 'col');
            makeResizable(document.getElementById('resizer-right'), (d) => { const el = document.getElementById('panel-middle'); const w = el.offsetWidth + d; if (w > 250 && w < window.innerWidth - 600) el.style.width = w + 'px'; }, 'col');
            makeResizable(document.getElementById('resizer-middle'), (d) => { const el = document.getElementById('panel-middle-top'); const h = el.offsetHeight + d; if (h > 100 && h < window.innerHeight - 200) el.style.height = h + 'px'; }, 'row');
        }
    </script>
</body>
